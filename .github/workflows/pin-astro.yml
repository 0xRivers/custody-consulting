name: Pin and verify Astro
on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/pin-astro.yml'
      - 'astro/**'
      - 'ops/checks/astro-environment.test.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pin-astro-staging
  cancel-in-progress: false
jobs:
  pin:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Pin Astro in the root lockfile
        run: npm install --save-dev --save-exact astro@7.4.5
      - name: Verify environment contract and both static builds
        run: |
          set -euo pipefail
          node --test ops/checks/astro-environment.test.mjs
          SITE_ENV=staging ./node_modules/.bin/astro build --root astro --config astro.config.mjs
          SITE_ENV=production ./node_modules/.bin/astro build --root astro --config astro.config.mjs
          test -s build/astro-staging/index.html
          test -s build/astro-production/index.html
          grep -Eiq '<meta[^>]+name="robots"[^>]+noindex' build/astro-staging/index.html
          if grep -Eiq '<meta[^>]+name="robots"[^>]+noindex' build/astro-production/index.html; then
            echo 'Production artifact must not contain noindex.' >&2
            exit 1
          fi
          npm audit
      - name: Commit the exact dependency graph
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = staging
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Pin Astro and verify environment builds'
          git push origin HEAD:staging
