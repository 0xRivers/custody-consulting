name: Foundation evidence
on:
  push:
    branches: [staging]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'ops/checks/foundation.py'
      - 'astro/**'
      - 'ops/checks/astro-environment.test.mjs'
      - 'ops/checks/article-rules.test.mjs'
      - 'ops/checks/performance-source.test.mjs'
      - '.github/workflows/foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install the exact dependency graph
        run: npm ci
      - name: Check Astro environment contract
        run: npm run test:astro:contract
      - name: Capture public baseline and verify staging exclusion
        run: python3 ops/checks/foundation.py
      - name: Collect dependency audit
        if: always()
        run: |
          mkdir -p build/foundation
          audit_status=0
          npm audit --json > build/foundation/npm-audit.json || audit_status=$?
          cat build/foundation/npm-audit.json
          exit "$audit_status"
      - name: Build website
        if: always()
        run: npm run build
      - name: Retain evidence even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-evidence
          path: build/foundation/
          retention-days: 30
