name: Check and deploy website
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custody-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: |
          npm ci
          npm run test:astro:contract
          npm run build:astro:staging
          npm run build:astro:production
          npm run check:editorial-boundaries
          npm run check:metadata-output
          npm run check:syndication-output
          npm run check:structured-data-output
          npm run check:performance-output
          for script in ops/*.sh ops/activate-release ops/activate-staging-release; do bash -n "$script"; done
      - uses: actions/upload-artifact@v4
        with:
          name: astro-production-${{ github.sha }}
          path: build/astro-production/
          if-no-files-found: error
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@v4
        with:
          name: astro-production-${{ github.sha }}
          path: build/astro-production/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare public pages for IndexNow
        id: indexnow
        continue-on-error: true
        run: node ops/indexnow.mjs prepare build/astro-production "$RUNNER_TEMP/indexnow.json"
      - name: Deploy over verified SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/custody-deploy-key"
          hosts="$RUNNER_TEMP/custody-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          export DEPLOY_KEY="$key" DEPLOY_KNOWN_HOSTS="$hosts"
          bash ops/deploy.sh
      - name: Verify the public production release
        run: |
          set -euo pipefail
          actual=$(curl --fail --silent --show-error --retry 2 --max-time 20 "https://custody.consulting/version.txt?expected=$GITHUB_SHA")
          test "$actual" = "$GITHUB_SHA"
          node ops/checks/url-migration.mjs https://custody.consulting
      - name: Notify IndexNow of changed public URLs
        if: steps.indexnow.outcome == 'success'
        continue-on-error: true
        run: node ops/indexnow.mjs submit "$RUNNER_TEMP/indexnow.json"
