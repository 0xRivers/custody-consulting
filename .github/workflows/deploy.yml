name: Check and deploy website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custody-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          node --check dist/app.js
          bash -n ops/*.sh ops/activate-release
          test -s dist/index.html
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Deploy over verified SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/custody-deploy-key"
          hosts="$RUNNER_TEMP/custody-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          export DEPLOY_KEY="$key" DEPLOY_KNOWN_HOSTS="$hosts"
          bash ops/deploy.sh
