name: Check and deploy staging
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custody-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check deployment scripts and assets
        run: |
          bash -n ops/*.sh ops/activate-release ops/activate-staging-release
          test -s build/staging/index.html
          test -s build/staging/app.js
      - name: Deploy over verified SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/custody-staging-key"
          hosts="$RUNNER_TEMP/custody-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          export DEPLOY_KEY="$key" DEPLOY_KNOWN_HOSTS="$hosts"
          bash ops/deploy-staging.sh
