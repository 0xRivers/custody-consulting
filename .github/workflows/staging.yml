name: Check and deploy staging
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custody-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:astro:contract
      - run: npm run build:astro:staging
      - name: Check deployment scripts and assets
        run: |
          bash -n ops/*.sh ops/activate-release ops/activate-staging-release
          test -s build/astro-staging/index.html
          test -s build/astro-staging/en/index.html
          test -s build/astro-staging/pl/index.html
          test -s build/astro-staging/en/blog/index.html
          test -s build/astro-staging/pl/blog/index.html
          node -e 'const fs = require("fs"); if (!/<meta[^>]*name="robots"[^>]*content="[^"]*noindex/i.test(fs.readFileSync("build/astro-staging/index.html", "utf8"))) throw new Error("Staging must include noindex")'
      - name: Check static performance budgets
        run: npm run check:performance-output
      - name: Measure mobile lab performance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/performance
          python3 -m http.server 4173 --bind 127.0.0.1 --directory build/astro-staging > "$RUNNER_TEMP/custody-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/en/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173/en/ > /dev/null
          chrome_bin=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          measured=false
          for attempt in 1 2; do
            if PERF_URL=http://127.0.0.1:4173/en/ CHROME_BIN="$chrome_bin" \
              node ops/checks/mobile-performance.mjs > build/performance/mobile-lab.json; then
              measured=true
              break
            fi
            printf 'Chrome measurement attempt %s failed; retrying.\n' "$attempt" >&2
          done
          test "$measured" = true
          cat build/performance/mobile-lab.json
      - name: Retain mobile performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobile-performance-${{ github.sha }}
          path: build/performance/mobile-lab.json
          retention-days: 30
      - name: Deploy over verified SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/custody-staging-key"
          hosts="$RUNNER_TEMP/custody-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          export DEPLOY_KEY="$key" DEPLOY_KNOWN_HOSTS="$hosts"
          bash ops/deploy-staging.sh
      - name: Verify public staging release
        run: |
          set -euo pipefail
          actual=$(curl --fail --silent --show-error --retry 2 --max-time 20 "https://staging.custody.consulting/version.txt?expected=$GITHUB_SHA")
          test "$actual" = "$GITHUB_SHA"
          printf 'Verified public staging release: %s\n' "$actual"
      - name: Verify staging is excluded from indexing
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 20 --head https://staging.custody.consulting/ > "$RUNNER_TEMP/staging-headers"
          grep -Ei '^x-robots-tag:.*noindex' "$RUNNER_TEMP/staging-headers"
      - name: Verify public staging routes
        run: node ops/checks/url-migration.mjs https://staging.custody.consulting
